name: Build and Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test -- --forceExit

    - name: Build application
      run: npm run build --if-present || echo "No build script"

    - name: Create deployment artifact
      run: |
        mkdir -p deployment
        cp -r . deployment/ || true
        # Exclude unnecessary files
        rm -rf deployment/node_modules deployment/.git deployment/coverage

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: deployment/
        retention-days: 5

  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

  deploy:
    needs: [build, security-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://dreamx.example.com

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: app-build

    # Add your deployment steps here
    # Examples: 
    # - Deploy to Azure App Service
    # - Deploy to Heroku
    # - Deploy using SSH
    # - Update Docker image and push to registry

    - name: Notify deployment
      run: |
        echo "Application deployed to production"
        echo "Version: ${{ github.sha }}"