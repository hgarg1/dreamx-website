<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dream X Favicon - Glowing X Logo -->
  <defs>
    <!-- Magenta/Pink gradient for left arm -->
    <linearGradient id="magentaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4fa3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e63e8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc3575;stop-opacity:1" />
    </linearGradient>
    <!-- Cyan/Blue gradient for right arm -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <!-- Purple blend for center -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle (optional, for better visibility) -->
  <circle cx="100" cy="100" r="95" fill="#0a0e27" opacity="0.8"/>
  
  <!-- Left arm of X (top-left to bottom-right) - Magenta/Pink -->
  <path d="M 30 30 L 100 100 L 170 170" 
        stroke="url(#magentaGradient)" 
        stroke-width="28" 
        stroke-linecap="round" 
        filter="url(#glow)"
        opacity="0.95"/>
  
  <!-- Right arm of X (top-right to bottom-left) - Cyan/Blue -->
  <path d="M 170 30 L 100 100 L 30 170" 
        stroke="url(#cyanGradient)" 
        stroke-width="28" 
        stroke-linecap="round" 
        filter="url(#glow)"
        opacity="0.95"/>
  
  <!-- Center intersection highlight -->
  <circle cx="100" cy="100" r="12" fill="url(#purpleGradient)" filter="url(#glow)"/>
</svg>
